name: Validate 0.8.1 packages
# One-time measurements for the release 0.8.1 (see VALIDATION.md). Runs on this pull request and by hand.
# Delete this file when the numbers are recorded.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/validate-0.8.1.yml
      - server.json
      - packages/whyts-mcp/**
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false
      - name: Pack both packages
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/out"
          npm pack ./packages/whyts-mcp --ignore-scripts --pack-destination "$RUNNER_TEMP/out"
          ls -l "$RUNNER_TEMP/out"
      - name: Install size, 0.8.1 tarball against 0.8.0 from npm
        run: |
          measure() {
            name=$1; shift
            dir="$RUNNER_TEMP/size-$name"; mkdir "$dir"; cd "$dir"; npm init -y >/dev/null
            npm install --ignore-scripts --no-audit --no-fund "$@" >/dev/null 2>&1
            echo "== $name: packages=$(npm ls --all --parseable 2>/dev/null | tail -n +2 | sort -u | wc -l) disk=$(du -sk node_modules | cut -f1)KB"
            npm ls --all 2>/dev/null | tail -n +2
            cd - >/dev/null
          }
          measure old-0.8.0 whyts@0.8.0
          measure new-0.8.1 "$RUNNER_TEMP"/out/whyts-0.8.1.tgz
          measure with-mcp "$RUNNER_TEMP"/out/whyts-0.8.1.tgz "$RUNNER_TEMP"/out/whyts-mcp-0.8.1.tgz
      - name: MCP Inspector, tools/list and analyze
        run: |
          cd "$RUNNER_TEMP/size-with-mcp"
          npm view @modelcontextprotocol/inspector version
          npx -y @modelcontextprotocol/inspector --cli node node_modules/whyts-mcp/bin/whyts-mcp.js --method tools/list | head -c 1200
          echo
          npx -y @modelcontextprotocol/inspector --cli node node_modules/whyts-mcp/bin/whyts-mcp.js --method tools/call --tool-name analyze --tool-arg "project=$GITHUB_WORKSPACE/examples/type-comparison" | head -c 1800
      - name: whyts mcp from the whyts tarball (alternative command)
        run: |
          (printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"t","version":"0"}}}\n'; sleep 15) | timeout 40 npx -y -p "$RUNNER_TEMP/out/whyts-0.8.1.tgz" -p @modelcontextprotocol/server@2 -p zod@4 whyts mcp 2>&1 | head -c 400
      - name: mcp-publisher validate
        run: |
          mkdir "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version
          cp "$GITHUB_WORKSPACE/server.json" .
          ./mcp-publisher validate
