name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      # The MCP server tests need these two packages. They are not dependencies of whyts.
      - run: npm install --no-save --ignore-scripts @modelcontextprotocol/server@2 zod@4
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
  typescript-6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # One command: a later 'npm install --no-save' would remove packages that an earlier one added.
      # The MCP server tests need the two MCP packages. They are not dependencies of whyts.
      - run: npm install --no-save --ignore-scripts typescript@6.0.3 @modelcontextprotocol/server@2 zod@4
      - run: npm test
  typescript-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # The MCP server tests need these two packages. They are not dependencies of whyts.
      - run: npm install --no-save --ignore-scripts @modelcontextprotocol/server@2 zod@4
      - run: npm install --prefix "$RUNNER_TEMP/ts7" --ignore-scripts typescript@7.0.2
      - run: npm test
        env:
          WHYTS_TS7: ${{ runner.temp }}/ts7/node_modules/typescript
